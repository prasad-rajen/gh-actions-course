name: 14 - Working with Artifacts
on:
  workflow_dispatch:

jobs:
  test-build:
    runs-on: ubuntu-latest
    outputs: 
        deps-cache-key: ${{ steps.cache-key.outputs.CACHE_KEY }}
    defaults:
        run:
          working-directory: 14-artifacts/react-app
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 26.x
      - name: Calculate cache key
        id: cache-key
        run echo "CACHE_KEY=deps-node-modules-${{hashFiles('14-artifacts/react-app/package-lock.json') }}" >> '$GITHUB_OUTPUT'
      - name: Download Cached Dependencies
        uses: actions/cache@v6
        id: cache
        with:
          path: 14-artifacts/react-app/node_modules
          key: ${{ steps.cache-key.outputs.CACHE_KEY }}
      - name: Install Dependencies
        if: ${{ steps.cache.outputs.cache-hit != 'true'}}
        run: npm ci
      - name: Unit Tests
        run: npm run test
      - name: Build Code
        run: npm run build
      - name: Upload Build files
        uses: actions/upload-artifacts@v7
        with:
          name: app
          path: 14-artifacts/react-app/build
  deploy:
    runs-on: ubuntu-latest
    needs: test-build
    steps:
      - name: Download build files
        uses: actions/download-artifact@v8
        with:
          name: app
          path: build
      - name: Show folder structure
        run: ls -R

