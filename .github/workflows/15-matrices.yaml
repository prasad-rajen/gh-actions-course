name: 15 - Working with Matrices
on:
  workflow_dispatch:
jobs:
  backwards-compatibility:
    name: ${{ matrix.os }}-${{ matrix.node-version }} 
    strategy:
        fail-fast: false
        matrix:
            node-version:
                - 24.x
                - 26.x
            os:
              - ubuntu-latest
              - windows-latest
            include:
              - os: ubuntu-latest
                node-version: 20.x
              - os: ubuntu-latest
                node-version: 21.x
                tag: experimental
         
    runs-on: ${{ matrix.os }}
    steps:
      - name: Setup Node
        uses: actions/setup-node@v6
        with: 
          node-version: ${{ matrix.node-version }}
      - name: Perfrom some Tests
        run: |
          echo "Running tests on OS ${{ matrix.os }} and NodeJS ${{ matrix.node-version }}"
      - name: Upload test results
        run: echo "Uploading test results"
  include-example:
    name: ${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}
    runs-on: ubuntu-latest
    strategy:
        matrix:
            color: [red, green]
            shape: [circle, square]
            size: [small, large]
            include:
                - opacity: 50
                - color: red
                  opacity: 75
                - shape: circle
                  opacity: 100
                - color: red
                  shape: triangle
                - color: green
                  shape: circle
                  size: medium
            exclude:
                - color: green
                  shape: circle
                  size: large            

    steps:
      - name: Dummy Step
        run: echo "${{ matrix.color }}-${{ matrix.shape }}-${{ matrix.size }}-${{ matrix.opacity }}"

